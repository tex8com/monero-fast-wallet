# The trailing slash deliberately strips /news before reaching the local API.
# `^~` prevents generic regex locations in the shared TEX8 Nginx setup from
# falling through to Nginx's static-file handler.
location ^~ /news/ {
    proxy_pass http://127.0.0.1:8091/;
    proxy_http_version 1.1;
    # Lets the deployment health check distinguish this route from a fallback
    # 404 without exposing any user or wallet information.
    add_header X-Monero-News-Proxy "1" always;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout 20s;
}

# Market data is intentionally served by the same TEX8 cache as the news
# feed.  Mobile clients see only this stable, wallet-independent endpoint;
# provider requests never leave the server boundary.
location ^~ /api/v1/market/ {
    proxy_pass http://127.0.0.1:8091/v1/market/;
    proxy_http_version 1.1;
    add_header X-Monero-Market-Proxy "1" always;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout 20s;
}

# General public, wallet-independent TEX8 content API. The app uses this for
# normalised market data and future versioned catalog/embedding snapshots.
location ^~ /api/ {
    proxy_pass http://127.0.0.1:8091/;
    proxy_http_version 1.1;
    add_header X-TEX8-Public-Content-API "1" always;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout 20s;
}
