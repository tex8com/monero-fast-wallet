[Service]
Environment=CUPRATE_SCANPACK_DIRECTORY=/var/lib/cuprate/fast-wallet-scanpacks
Environment=CUPRATE_SCANPACK_SIGNING_KEY_FILE=/etc/cuprate/scanpack-signing.key
Environment=CUPRATE_SCANPACK_START_HEIGHT=3400000
Environment=CUPRATE_SCANPACK_BLOCKS_PER_PACK=2048
Environment=CUPRATE_SCANPACK_INTERVAL_MS=5000
