# This snippet is included from both xmr.tex8.com server blocks. Never accept
# Fast Wallet enrollment over plaintext HTTP.
if ($scheme = http) {
    return 308 https://$host$request_uri;
}

# Public client-to-Gateway routes.
location = /api/v1/official-worker-descriptor {
    limit_except GET { deny all; }
    proxy_pass http://127.0.0.1:8090;
    include /etc/nginx/proxy_params;
    client_max_body_size 1k;
}

# Community Workers register and refresh signed public descriptors here. The
# Directory publishes only entries approved by the local TEX8 administrator.
location = /api/v1/community-workers {
    limit_except GET { deny all; }
    proxy_pass http://127.0.0.1:8096;
    include /etc/nginx/proxy_params;
    client_max_body_size 1k;
}

location = /api/v1/community-workers/register {
    limit_except POST { deny all; }
    limit_req zone=fast_wallet_worker_directory burst=3 nodelay;
    proxy_pass http://127.0.0.1:8096;
    include /etc/nginx/proxy_params;
    client_max_body_size 4k;
}

location = /api/v1/community-workers/heartbeat {
    limit_except POST { deny all; }
    limit_req zone=fast_wallet_worker_directory burst=6 nodelay;
    proxy_pass http://127.0.0.1:8096;
    include /etc/nginx/proxy_params;
    client_max_body_size 4k;
}

location ^~ /api/v1/community-workers/ {
    limit_except GET { deny all; }
    proxy_pass http://127.0.0.1:8096;
    include /etc/nginx/proxy_params;
    client_max_body_size 1k;
}

location = /api/v1/installations/assignments {
    limit_except POST { deny all; }
    proxy_pass http://127.0.0.1:8090;
    include /etc/nginx/proxy_params;
    client_max_body_size 8k;
}

# This must be a ^~ prefix. The co-located public-content service owns a
# broader `location ^~ /api/`; a regex location here would never be selected
# and authenticated revocation would incorrectly fall through to a 404.
# The Gateway itself strictly validates the trailing 64-byte lowercase handle.
location ^~ /api/v1/installations/assignments/ {
    limit_except DELETE { deny all; }
    proxy_pass http://127.0.0.1:8090;
    include /etc/nginx/proxy_params;
    client_max_body_size 1k;
}

location = /api/v1/installations/provider {
    limit_except GET POST DELETE { deny all; }
    proxy_pass http://127.0.0.1:8090;
    include /etc/nginx/proxy_params;
    client_max_body_size 8k;
}

# Desktop uses an OS-secured per-installation secret because Firebase App
# Check is a mobile attestation mechanism. Keep this exact route narrowly
# bounded; the Gateway also enforces installation and storage capacity.
location = /api/v1/installations/desktop-provider {
    limit_except POST { deny all; }
    limit_req zone=fast_wallet_desktop_bootstrap burst=3 nodelay;
    proxy_pass http://127.0.0.1:8090;
    include /etc/nginx/proxy_params;
    client_max_body_size 2k;
}

location = /api/v1/installations/provider/delivery {
    limit_except POST DELETE { deny all; }
    proxy_pass http://127.0.0.1:8090;
    include /etc/nginx/proxy_params;
    client_max_body_size 4k;
}

# An authenticated device may ask only for its own generic delivery test. The
# Gateway accepts no wallet or notification content from this route.
location = /api/v1/installations/test-push {
    limit_except POST { deny all; }
    limit_req zone=fast_wallet_desktop_bootstrap burst=2 nodelay;
    proxy_pass http://127.0.0.1:8090;
    include /etc/nginx/proxy_params;
    client_max_body_size 1k;
}

# A Worker wake contains only a fixed generic event and is accepted only with
# the descriptor key bound to an active Gateway assignment.
location = /api/v1/workers/wake {
    limit_except POST { deny all; }
    limit_req zone=fast_wallet_worker_wake burst=60 nodelay;
    proxy_pass http://127.0.0.1:8090;
    include /etc/nginx/proxy_params;
    client_max_body_size 4k;
}

location = /api/v1/provider-grants {
    limit_except POST { deny all; }
    proxy_pass http://127.0.0.1:8095;
    include /etc/nginx/proxy_params;
    client_max_body_size 8k;
}

location = /api/v1/notifications/stream {
    limit_except GET { deny all; }
    proxy_pass http://127.0.0.1:8090;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    include /etc/nginx/proxy_params;
    proxy_read_timeout 75s;
    proxy_buffering off;
    client_max_body_size 1k;
}

# Public ciphertext upload. The body has a fixed protocol size and the Relay
# rejects any plaintext or malformed envelope.
location = /v1/envelopes {
    limit_except POST { deny all; }
    proxy_pass http://127.0.0.1:8094;
    include /etc/nginx/proxy_params;
    client_max_body_size 2k;
}

# A 256-bit ciphertext identifier is the bearer lookup capability. The Relay
# returns only pending or the descriptor-bound Worker signature; never wallet
# plaintext, an address, a key or assignment metadata.
location ^~ /v1/envelopes/ {
    limit_except GET { deny all; }
    proxy_pass http://127.0.0.1:8094;
    include /etc/nginx/proxy_params;
    client_max_body_size 1k;
}

# The outbound-only Worker authenticates every pull and ACK with its
# descriptor-bound online signing key. These are public because the Worker may
# later run on a separate host.
location = /v1/workers/pull {
    limit_except POST { deny all; }
    proxy_pass http://127.0.0.1:8094;
    include /etc/nginx/proxy_params;
    client_max_body_size 4k;
}

location = /v1/workers/ack {
    limit_except POST { deny all; }
    proxy_pass http://127.0.0.1:8094;
    include /etc/nginx/proxy_params;
    client_max_body_size 4k;
}

# Deliberately not exposed:
# - Relay /v1/assignments/sponsor and /v1/assignments/delete
# - Gateway legacy /api/v1/internal/worker-wake
# - Directory /api/v1/internal/community-workers/* administration
# - all component /healthz routes
