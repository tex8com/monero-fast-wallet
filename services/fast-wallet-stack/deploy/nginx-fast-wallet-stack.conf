# This snippet is included from both xmr.tex8.com server blocks. Never accept
# Fast Wallet enrollment over plaintext HTTP.
if ($scheme = http) {
    return 308 https://$host$request_uri;
}

# Public client-to-Gateway routes.
location = /api/v1/official-worker-descriptor {
    limit_except GET { deny all; }
    proxy_pass http://127.0.0.1:8090;
    include /etc/nginx/proxy_params;
    client_max_body_size 1k;
}

location = /api/v1/installations/assignments {
    limit_except POST { deny all; }
    proxy_pass http://127.0.0.1:8090;
    include /etc/nginx/proxy_params;
    client_max_body_size 8k;
}

location ~ "^/api/v1/installations/assignments/[0-9a-f]{64}$" {
    limit_except DELETE { deny all; }
    proxy_pass http://127.0.0.1:8090;
    include /etc/nginx/proxy_params;
    client_max_body_size 1k;
}

location = /api/v1/installations/provider {
    limit_except POST DELETE { deny all; }
    proxy_pass http://127.0.0.1:8090;
    include /etc/nginx/proxy_params;
    client_max_body_size 8k;
}

location = /api/v1/installations/provider/delivery {
    limit_except POST DELETE { deny all; }
    proxy_pass http://127.0.0.1:8090;
    include /etc/nginx/proxy_params;
    client_max_body_size 4k;
}

location = /api/v1/provider-grants {
    limit_except POST { deny all; }
    proxy_pass http://127.0.0.1:8095;
    include /etc/nginx/proxy_params;
    client_max_body_size 8k;
}

location = /api/v1/notifications/stream {
    limit_except GET { deny all; }
    proxy_pass http://127.0.0.1:8090;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    include /etc/nginx/proxy_params;
    proxy_read_timeout 75s;
    proxy_buffering off;
    client_max_body_size 1k;
}

# Public ciphertext upload. The body has a fixed protocol size and the Relay
# rejects any plaintext or malformed envelope.
location = /v1/envelopes {
    limit_except POST { deny all; }
    proxy_pass http://127.0.0.1:8094;
    include /etc/nginx/proxy_params;
    client_max_body_size 2k;
}

# The outbound-only Worker authenticates every pull and ACK with its
# descriptor-bound online signing key. These are public because the Worker may
# later run on a separate host.
location = /v1/workers/pull {
    limit_except POST { deny all; }
    proxy_pass http://127.0.0.1:8094;
    include /etc/nginx/proxy_params;
    client_max_body_size 4k;
}

location = /v1/workers/ack {
    limit_except POST { deny all; }
    proxy_pass http://127.0.0.1:8094;
    include /etc/nginx/proxy_params;
    client_max_body_size 4k;
}

# Deliberately not exposed:
# - Relay /v1/assignments/sponsor and /v1/assignments/delete
# - Gateway /api/v1/internal/worker-wake
# - all component /healthz routes
