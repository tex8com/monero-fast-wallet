# Bounded application services exposed only through the primary Tor v3
# hidden service. The including server listens on loopback for Tor and has no
# public Clearnet name.

location = /api/v1/community-workers {
    limit_except GET { deny all; }
    proxy_pass http://127.0.0.1:8096;
    include /etc/nginx/proxy_params;
    client_max_body_size 1k;
}

location ^~ /api/v1/community-workers/ {
    limit_except GET { deny all; }
    proxy_pass http://127.0.0.1:8096;
    include /etc/nginx/proxy_params;
    client_max_body_size 1k;
}

# Monero Enthusiast public API. Internal moderation endpoints remain absent.
location = /v2 {
    return 404;
}

location ^~ /v2/ {
    proxy_pass http://127.0.0.1:8092;
    proxy_http_version 1.1;
    add_header X-Monero-Enthusiast-V1 "1" always;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout 20s;
    client_max_body_size 64k;
}

# Expose only Matrix client traffic. Synapse administration stays local.
location ^~ /_synapse/ {
    return 404;
}

location ^~ /_matrix/ {
    proxy_pass http://127.0.0.1:8008;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;
    client_max_body_size 10m;
}

# The signed update manifest is copied here by publish-mobile-manifest.sh.
location = /xmr/update.json {
    limit_except GET { deny all; }
    alias /srv/mfw-onion/update.json;
    default_type application/json;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
}
