# Public Community V1 API. The separate internal moderation listener on 8093
# is intentionally not proxied.
location = /v2 {
    return 404;
}

location ^~ /v2/ {
    proxy_pass http://127.0.0.1:8092;
    proxy_http_version 1.1;
    add_header X-Monero-Enthusiast-V1 "1" always;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout 20s;
    client_max_body_size 64k;
}

# Immutable, server-signed local-search generations.
location ^~ /v1/catalogs/ {
    root /srv/monero-enthusiast-public;
    default_type application/json;
    add_header Cache-Control "public, max-age=60, must-revalidate";
    add_header X-Content-Type-Options "nosniff";
    try_files $uri =404;
}

location ^~ /v1/queries/ {
    root /srv/monero-enthusiast-public;
    default_type application/json;
    add_header Cache-Control "public, max-age=60, must-revalidate";
    add_header X-Content-Type-Options "nosniff";
    try_files $uri =404;
}

# Advertising remains a separately signed, wallet-independent catalog.
location ^~ /v1/ads/ {
    proxy_pass http://127.0.0.1:8091;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_connect_timeout 5s;
    proxy_read_timeout 20s;
}

# Expose only Matrix client traffic. Synapse administration stays loopback-only.
location ^~ /_synapse/ {
    return 404;
}

location ^~ /_matrix/ {
    proxy_pass http://127.0.0.1:8008;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;
    client_max_body_size 10m;
}
