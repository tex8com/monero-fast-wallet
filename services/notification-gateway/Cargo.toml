[package]
name = "notification-gateway"
version = "0.1.0"
edition = "2021"
publish = false
license = "AGPL-3.0-only"

[dependencies]
axum = { version = "0.8", features = ["http1", "json", "tokio", "ws"], default-features = false }
chacha20poly1305 = { version = "0.10", features = ["std"] }
ed25519-dalek = "2"
fast-wallet-protocol = { path = "../../native/fast-wallet-protocol" }
fs2 = "0.4"
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
hex = "0.4"
libc = "0.2"
reqwest = { version = "0.12", features = ["blocking", "http2", "json", "rustls-tls"], default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2"
tokio = { version = "1", features = ["fs", "macros", "net", "rt-multi-thread", "signal", "sync", "time"], default-features = false }
zeroize = "1"

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
