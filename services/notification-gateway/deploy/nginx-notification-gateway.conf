# Public read route. The installation capability is carried only in a HTTPS
# request header, not in a query parameter or server access log.
location = /api/v1/notifications/events {
    limit_except GET { deny all; }
    proxy_pass http://127.0.0.1:8090/api/v1/notifications/events;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 3s;
    proxy_read_timeout 15s;
    client_max_body_size 1k;
}

# WNS channel registration uses the anonymous installation capability only in
# an HTTPS header. Channel URIs are never included in paths, query strings, or
# access-loggable URLs.
location = /api/v1/notifications/installations {
    limit_except POST DELETE { deny all; }
    proxy_pass http://127.0.0.1:8090/api/v1/notifications/installations;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 3s;
    proxy_read_timeout 15s;
    client_max_body_size 8k;
}
