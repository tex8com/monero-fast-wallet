# Private real-time channel for the per-user Windows/Linux agents. The
# anonymous installation capability stays in a request header and WebSocket
# frames contain only opaque event ids and a generic category.
location = /api/v1/notifications/stream {
    limit_except GET { deny all; }
    proxy_pass http://127.0.0.1:8090/api/v1/notifications/stream;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 3s;
    proxy_read_timeout 75s;
    client_max_body_size 1k;
}
