apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"
if (file("google-services.json").exists()) {
    apply plugin: "com.google.gms.google-services"
}

/**
 * This is the configuration block to customize your React Native Android app.
 * By default you don't need to apply any configuration, just uncomment the lines you need.
 */
react {
    /* Folders */
    //   The root of your project, i.e. where "package.json" lives. Default is '../..'
    // root = file("../../")
    //   The folder where the react-native NPM package is. Default is ../../node_modules/react-native
    // reactNativeDir = file("../../node_modules/react-native")
    //   The folder where the react-native Codegen package is. Default is ../../node_modules/@react-native/codegen
    // codegenDir = file("../../node_modules/@react-native/codegen")
    //   The cli.js file which is the React Native CLI entrypoint. Default is ../../node_modules/react-native/cli.js
    // cliFile = file("../../node_modules/react-native/cli.js")

    /* Variants */
    //   The list of variants to that are debuggable. For those we're going to
    //   skip the bundling of the JS bundle and the assets. Default is "debug", "debugOptimized".
    //   If you add flavors like lite, prod, etc. you'll have to list your debuggableVariants.
    // debuggableVariants = ["liteDebug", "liteDebugOptimized", "prodDebug", "prodDebugOptimized"]

    /* Bundling */
    //   A list containing the node command and its flags. Default is just 'node'.
    // nodeExecutableAndArgs = ["node"]
    //
    //   The command to run when bundling. By default is 'bundle'
    // bundleCommand = "ram-bundle"
    //
    //   The path to the CLI configuration file. Default is empty.
    // bundleConfig = file(../rn-cli.config.js)
    //
    //   The name of the generated asset file containing your JS bundle
    // bundleAssetName = "MyApplication.android.bundle"
    //
    //   The entry file for bundle generation. Default is 'index.android.js' or 'index.js'
    // entryFile = file("../js/MyApplication.android.js")
    //
    //   A list of extra flags to pass to the 'bundle' commands.
    //   See https://github.com/react-native-community/cli/blob/main/docs/commands.md#bundle
    // extraPackagerArgs = []

    /* Hermes Commands */
    //   The hermes compiler command to run. By default it is 'hermesc'
    // hermesCommand = "$rootDir/my-custom-hermesc/bin/hermesc"
    //
    //   The list of flags to pass to the Hermes compiler. By default is "-O", "-output-source-map"
    // hermesFlags = ["-O", "-output-source-map"]

    /* Autolinking */
    autolinkLibrariesWithApp()
}

/**
 * Set this to true to Run Proguard on Release builds to minify the Java bytecode.
 */
def enableProguardInReleaseBuilds = false

/**
 * The preferred build flavor of JavaScriptCore (JSC)
 *
 * For example, to use the international variant, you can use:
 * `def jscFlavor = io.github.react-native-community:jsc-android-intl:2026004.+`
 *
 * The international variant includes ICU i18n library and necessary data
 * allowing to use e.g. `Date.toLocaleString` and `String.localeCompare` that
 * give correct results when using with locales other than en-US. Note that
 * this variant is about 6MiB larger per architecture than default.
 */
def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'
def moneroWalletBridgeWithMonero =
        (findProperty("moneroWalletBridgeWithMonero") ?: "false").toString().toBoolean()
def moneroSourceDir = (findProperty("moneroSourceDir") ?: "").toString()
def moneroWalletLinkManifest = (findProperty("moneroWalletLinkManifest") ?: "").toString()
def moneroWalletLinkRoot = (findProperty("moneroWalletLinkRoot") ?: "").toString()
def moneroWalletApiLibrary = (findProperty("moneroWalletApiLibrary") ?: "").toString()
def moneroWalletApiRoot = (findProperty("moneroWalletApiRoot") ?: "").toString()
def moneroFastCryptoLibrary = (findProperty("moneroFastCryptoLibrary") ?: "").toString()
def moneroFastCryptoRoot = (findProperty("moneroFastCryptoRoot") ?: "").toString()
def moneroWalletExtraLibraries = (findProperty("moneroWalletExtraLibraries") ?: "").toString()
def moneroWalletExtraLibraryDirs = (findProperty("moneroWalletExtraLibraryDirs") ?: "").toString()
def moneroWalletExtraLinkOptions = (findProperty("moneroWalletExtraLinkOptions") ?: "").toString()
def moneroWalletExternalBuildDir = (findProperty("moneroWalletExternalBuildDir") ?: System.getenv("MONERO_WALLET_ANDROID_BUILD_DIR") ?: "").toString().trim()
def uploadStoreFile = (System.getenv("MONERO_UPLOAD_STORE_FILE") ?: "").trim()
def uploadStorePassword = (System.getenv("MONERO_UPLOAD_STORE_PASSWORD") ?: "").trim()
def uploadKeyAlias = (System.getenv("MONERO_UPLOAD_KEY_ALIAS") ?: "").trim()
def uploadKeyPassword = (System.getenv("MONERO_UPLOAD_KEY_PASSWORD") ?: "").trim()
def hasUploadSigning = [
        uploadStoreFile,
        uploadStorePassword,
        uploadKeyAlias,
        uploadKeyPassword,
].every { !it.isEmpty() }

// Native Monero archives and Android's CMake intermediates are large. Keep
// generated output on the optional external build volume instead of allowing
// a development compile to exhaust the system disk. This affects only Gradle
// output; app sources, signing material, and wallet files stay in place.
if (!moneroWalletExternalBuildDir.isEmpty()) {
    layout.buildDirectory.set(file(moneroWalletExternalBuildDir))
}

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.monerowallet"
    defaultConfig {
        applicationId "com.tex8.monerowallet"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // Increment for each shareable APK so Android accepts it as an update
        // over the previous locally installed release.
        versionCode 8
        versionName "1.0.7"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        externalNativeBuild {
            cmake {
                cppFlags "-std=c++17 -fexceptions -frtti"
                arguments "-DMONERO_WALLET_BRIDGE_WITH_MONERO=${moneroWalletBridgeWithMonero ? "ON" : "OFF"}",
                        "-DMONERO_SOURCE_DIR=${moneroSourceDir}",
                        "-DMONERO_WALLET_LINK_MANIFEST=${moneroWalletLinkManifest}",
                        "-DMONERO_WALLET_LINK_ROOT=${moneroWalletLinkRoot}",
                        "-DMONERO_WALLET_API_LIBRARY=${moneroWalletApiLibrary}",
                        "-DMONERO_WALLET_API_ROOT=${moneroWalletApiRoot}",
                        "-DMONERO_FAST_CRYPTO_LIBRARY=${moneroFastCryptoLibrary}",
                        "-DMONERO_FAST_CRYPTO_ROOT=${moneroFastCryptoRoot}",
                        "-DMONERO_WALLET_EXTRA_LIBRARIES=${moneroWalletExtraLibraries}",
                        "-DMONERO_WALLET_EXTRA_LIBRARY_DIRS=${moneroWalletExtraLibraryDirs}",
                        "-DMONERO_WALLET_EXTRA_LINK_OPTIONS=${moneroWalletExtraLinkOptions}"
            }
        }
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        release {
            if (hasUploadSigning) {
                storeFile file(uploadStoreFile)
                storePassword uploadStorePassword
                keyAlias uploadKeyAlias
                keyPassword uploadKeyPassword
            }
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            if (hasUploadSigning) {
                signingConfig signingConfigs.release
            }
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
    }
    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            // AGP keeps CMake's staging directory outside layout.buildDirectory
            // by default (<module>/.cxx). Relocate it as well when an external
            // build volume is configured, otherwise a full native Monero link
            // can still exhaust the internal macOS disk.
            if (!moneroWalletExternalBuildDir.isEmpty()) {
                buildStagingDirectory file("${moneroWalletExternalBuildDir}-cxx")
            }
        }
    }
}

gradle.taskGraph.whenReady { graph ->
    def requestedReleaseBuild = graph.allTasks.any {
        it.path == ":app:bundleRelease" || it.path == ":app:assembleRelease"
    }
    if (requestedReleaseBuild && !hasUploadSigning) {
        throw new GradleException(
                "Release signing is required. Run scripts/android-play-bundle.sh or set MONERO_UPLOAD_* environment variables."
        )
    }
}

dependencies {
    // The version of react-native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")
    // Use the lifecycle-aware AndroidX prompt. The platform prompt can be
    // launched before React's activity has focus and then remain invisible.
    implementation("androidx.biometric:biometric:1.1.0")
    implementation("androidx.core:core-ktx:1.13.1")
    testImplementation("junit:junit:4.13.2")

    androidTestImplementation("androidx.test:core:1.6.1")
    androidTestImplementation("androidx.test:runner:1.6.2")
    androidTestImplementation("androidx.test.ext:junit:1.2.1")
    androidTestImplementation("junit:junit:4.13.2")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}
