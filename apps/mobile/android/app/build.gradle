apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"
def moneroWalletApplicationId =
        (findProperty("moneroWalletApplicationId") ?: "com.tex8.monerowallet").toString()
def moneroSkipGoogleServices =
        (findProperty("moneroSkipGoogleServices") ?: "false").toString().toBoolean()
def googleServicesFile = file("google-services.json")
if (!moneroSkipGoogleServices &&
        moneroWalletApplicationId == "com.tex8.monerowallet" &&
        !googleServicesFile.exists()) {
    throw new GradleException(
            "Product builds require android/app/google-services.json; without it Firebase App Check crashes during startup."
    )
}
if (googleServicesFile.exists() && !moneroSkipGoogleServices) {
    apply plugin: "com.google.gms.google-services"
}

/**
 * This is the configuration block to customize your React Native Android app.
 * By default you don't need to apply any configuration, just uncomment the lines you need.
 */
react {
    /* Folders */
    //   The root of your project, i.e. where "package.json" lives. Default is '../..'
    // root = file("../../")
    //   The folder where the react-native NPM package is. Default is ../../node_modules/react-native
    // reactNativeDir = file("../../node_modules/react-native")
    //   The folder where the react-native Codegen package is. Default is ../../node_modules/@react-native/codegen
    // codegenDir = file("../../node_modules/@react-native/codegen")
    //   The cli.js file which is the React Native CLI entrypoint. Default is ../../node_modules/react-native/cli.js
    // cliFile = file("../../node_modules/react-native/cli.js")

    /* Variants */
    //   The list of variants to that are debuggable. For those we're going to
    //   skip the bundling of the JS bundle and the assets. Default is "debug", "debugOptimized".
    //   If you add flavors like lite, prod, etc. you'll have to list your debuggableVariants.
    // debuggableVariants = ["liteDebug", "liteDebugOptimized", "prodDebug", "prodDebugOptimized"]

    /* Bundling */
    //   A list containing the node command and its flags. Default is just 'node'.
    // nodeExecutableAndArgs = ["node"]
    //
    //   The command to run when bundling. By default is 'bundle'
    // bundleCommand = "ram-bundle"
    //
    //   The path to the CLI configuration file. Default is empty.
    // bundleConfig = file(../rn-cli.config.js)
    //
    //   The name of the generated asset file containing your JS bundle
    // bundleAssetName = "MyApplication.android.bundle"
    //
    //   The entry file for bundle generation. Default is 'index.android.js' or 'index.js'
    // entryFile = file("../js/MyApplication.android.js")
    //
    //   A list of extra flags to pass to the 'bundle' commands.
    //   See https://github.com/react-native-community/cli/blob/main/docs/commands.md#bundle
    // extraPackagerArgs = []

    /* Hermes Commands */
    //   The hermes compiler command to run. By default it is 'hermesc'
    // hermesCommand = "$rootDir/my-custom-hermesc/bin/hermesc"
    //
    //   The list of flags to pass to the Hermes compiler. By default is "-O", "-output-source-map"
    // hermesFlags = ["-O", "-output-source-map"]

    /* Autolinking */
    autolinkLibrariesWithApp()
}

/**
 * Set this to true to Run Proguard on Release builds to minify the Java bytecode.
 */
def enableProguardInReleaseBuilds = true

/**
 * The preferred build flavor of JavaScriptCore (JSC)
 *
 * For example, to use the international variant, you can use:
 * `def jscFlavor = io.github.react-native-community:jsc-android-intl:2026004.+`
 *
 * The international variant includes ICU i18n library and necessary data
 * allowing to use e.g. `Date.toLocaleString` and `String.localeCompare` that
 * give correct results when using with locales other than en-US. Note that
 * this variant is about 6MiB larger per architecture than default.
 */
def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.0.1'
def moneroWalletBridgeWithMonero =
        (findProperty("moneroWalletBridgeWithMonero") ?: "false").toString().toBoolean()
def moneroSourceDir = (findProperty("moneroSourceDir") ?: "").toString()
def moneroWalletLinkManifest = (findProperty("moneroWalletLinkManifest") ?: "").toString()
def moneroWalletLinkRoot = (findProperty("moneroWalletLinkRoot") ?: "").toString()
def moneroWalletApiLibrary = (findProperty("moneroWalletApiLibrary") ?: "").toString()
def moneroWalletApiRoot = (findProperty("moneroWalletApiRoot") ?: "").toString()
def moneroFastCryptoLibrary = (findProperty("moneroFastCryptoLibrary") ?: "").toString()
def moneroFastCryptoRoot = (findProperty("moneroFastCryptoRoot") ?: "").toString()
def moneroFastWalletProtocolLibrary = (findProperty("moneroFastWalletProtocolLibrary") ?: "").toString()
def moneroFastWalletProtocolRoot = (findProperty("moneroFastWalletProtocolRoot") ?: "").toString()
def moneroCommunityMatrixLibrary = (findProperty("moneroCommunityMatrixLibrary") ?: "").toString()
def moneroCommunityMatrixRoot = (findProperty("moneroCommunityMatrixRoot") ?: "").toString()
def moneroCommunityHarrierLibrary = (findProperty("moneroCommunityHarrierLibrary") ?: "").toString()
def moneroCommunityHarrierJniLibs = (findProperty("moneroCommunityHarrierJniLibs") ?: "").toString()
def moneroCommunityAssetRoot = (
        findProperty("moneroCommunityAssetRoot")
                ?: file("${rootDir}/../../../build/community-v1-release-assets").absolutePath
).toString().trim()
def mobileAppVersionManifest =
        new groovy.json.JsonSlurper().parse(file("${rootDir}/../../../config/mobile-app-version.json"))
if (mobileAppVersionManifest.schemaVersion != 1 ||
        !(mobileAppVersionManifest.versionName instanceof String) ||
        !(mobileAppVersionManifest.androidVersionCode instanceof Number)) {
    throw new GradleException("Unsupported mobile app version manifest")
}
def v1ReleaseFeatureManifest =
        new groovy.json.JsonSlurper().parse(file("${rootDir}/../../../config/v1-release-features.json"))
if (v1ReleaseFeatureManifest.schemaVersion != 1 ||
        v1ReleaseFeatureManifest.profile != "safe-wallet-v1") {
    throw new GradleException("Unsupported V1 release feature manifest")
}
def fastWalletOfficialWorkerEnabled =
        v1ReleaseFeatureManifest.features.officialWorker == true
def officialWorkerParameters =
        v1ReleaseFeatureManifest.parameters.fastWalletOfficialWorker ?: [:]
def fastWalletGatewayOrigin = (
        findProperty("fastWalletGatewayOrigin")
                ?: officialWorkerParameters.gatewayOrigin
                ?: ""
).toString().trim().replaceAll('/+$', '')
def fastWalletRegistrationOrigin = (
        findProperty("fastWalletRegistrationOrigin")
                ?: officialWorkerParameters.registrationOrigin
                ?: fastWalletGatewayOrigin
).toString().trim().replaceAll('/+$', '')
def fastWalletOfficialWorkerRootId = (
        findProperty("fastWalletOfficialWorkerRootId")
                ?: officialWorkerParameters.rootIdHex
                ?: ""
).toString().trim()
def privateServiceOrigin = { value ->
    if (!(value instanceof String) || value.length() > 200) {
        return false
    }
    try {
        def uri = new URI(value)
        def onion = uri.scheme == "http" &&
                uri.host != null &&
                uri.host.toLowerCase() ==~ /^[a-z2-7]{56}\.onion$/
        return (uri.scheme == "https" || onion) &&
                uri.host != null &&
                uri.rawUserInfo == null &&
                (uri.rawPath == null || uri.rawPath == "" || uri.rawPath == "/") &&
                uri.rawQuery == null &&
                uri.rawFragment == null
    } catch (Exception ignored) {
        return false
    }
}
if (fastWalletOfficialWorkerEnabled) {
    if (!privateServiceOrigin(fastWalletGatewayOrigin) ||
            !privateServiceOrigin(fastWalletRegistrationOrigin)) {
        throw new GradleException(
                "officialWorker requires exact HTTPS or Tor v3 Onion origins")
    }
    if (!(fastWalletOfficialWorkerRootId ==~ /^[0-9a-f]{64}$/)) {
        throw new GradleException(
                "officialWorker requires a pinned 32-byte lowercase-hex root ID")
    }
}
def fastWalletPrivateWorkerPairingEnabled =
        v1ReleaseFeatureManifest.features.privateWorkerPairing == true
def privatePhoneDeviceContactsEnabled =
        v1ReleaseFeatureManifest.features.deviceContactDiscovery == true
def moneroEnthusiastV1DevelopmentDisabled = (
        findProperty("moneroEnthusiastV1DevelopmentDisabled") ?: "false"
).toString().toBoolean()
if (moneroEnthusiastV1DevelopmentDisabled &&
        moneroWalletApplicationId == "com.tex8.monerowallet") {
    throw new GradleException(
            "Monero Enthusiast V1 may be disabled only for a separate development application ID"
    )
}
def moneroEnthusiastV1Enabled =
        v1ReleaseFeatureManifest.features.moneroEnthusiastV1 == true &&
                !moneroEnthusiastV1DevelopmentDisabled
def moneroEnthusiastConfig =
        v1ReleaseFeatureManifest.parameters.moneroEnthusiastV1
def communitySafeResource = { value ->
    value instanceof String &&
            !value.isEmpty() &&
            value.length() <= 256 &&
            !value.startsWith("/") &&
            !value.split("/").any { part -> part.isEmpty() || part == ".." } &&
            value ==~ /^[A-Za-z0-9._\\/-]+$/
}
if (moneroEnthusiastV1Enabled) {
    if (!(moneroEnthusiastConfig instanceof Map) ||
            !privateServiceOrigin(moneroEnthusiastConfig.apiOrigin) ||
            !privateServiceOrigin(moneroEnthusiastConfig.matrixHomeserver) ||
            !privateServiceOrigin(moneroEnthusiastConfig.catalogOrigin) ||
            !privateServiceOrigin(moneroEnthusiastConfig.advertisingOrigin) ||
            !(moneroEnthusiastConfig.catalogScope instanceof String) ||
            !(moneroEnthusiastConfig.catalogScope ==~ /^[A-Za-z0-9_-]{1,128}$/) ||
            !(moneroEnthusiastConfig.catalogVerifyingKeyHex ==~ /^[0-9a-f]{64}$/) ||
            !(moneroEnthusiastConfig.advertisingVerifyingKeyHex ==~ /^[0-9a-f]{64}$/) ||
            !(moneroEnthusiastConfig.advertisingCountry ==~ /^[A-Z]{2}$/) ||
            !(moneroEnthusiastConfig.artifactVerifyingKeyHex ==~ /^[0-9a-f]{64}$/) ||
            !communitySafeResource(moneroEnthusiastConfig.artifactManifestResource) ||
            !communitySafeResource(moneroEnthusiastConfig.pteResource) ||
            !communitySafeResource(moneroEnthusiastConfig.tokenizerResource) ||
            !communitySafeResource(moneroEnthusiastConfig.conformanceResource)) {
        throw new GradleException(
                "moneroEnthusiastV1 requires a complete pinned private-service release configuration"
        )
    }
    if (moneroCommunityAssetRoot.isEmpty() || !file(moneroCommunityAssetRoot).isDirectory()) {
        throw new GradleException(
                "moneroEnthusiastV1 requires moneroCommunityAssetRoot with verified native assets"
        )
    }
    [
            moneroEnthusiastConfig.artifactManifestResource,
            moneroEnthusiastConfig.pteResource,
            moneroEnthusiastConfig.tokenizerResource,
            moneroEnthusiastConfig.conformanceResource,
    ].each { resource ->
        if (!new File(moneroCommunityAssetRoot, resource).isFile()) {
            throw new GradleException("Missing Monero Enthusiast asset: ${resource}")
        }
    }
}
def communityConfigValue = { name ->
    moneroEnthusiastConfig instanceof Map
            ? (moneroEnthusiastConfig[name] ?: "").toString()
            : ""
}
def privatePhoneDirectoryConfig =
        v1ReleaseFeatureManifest.parameters.privatePhoneDirectory
if (privatePhoneDeviceContactsEnabled && privatePhoneDirectoryConfig == null) {
    throw new GradleException(
            "deviceContactDiscovery requires a pinned privatePhoneDirectory release configuration"
    )
}
def privatePhoneEvaluators =
        privatePhoneDirectoryConfig?.evaluators instanceof List
                ? privatePhoneDirectoryConfig.evaluators
                : []
def privatePhoneSnapshotConfig = privatePhoneDirectoryConfig?.snapshot
def privatePhoneVerificationConfig = privatePhoneDirectoryConfig?.verification
def privatePhoneEpoch = privatePhoneDirectoryConfig?.epoch ?: 0
def privatePhoneVerificationOrigin =
        privatePhoneVerificationConfig?.origin ?: ""
def privatePhoneEvaluatorOneOrigin =
        privatePhoneEvaluators.size() == 2 ? privatePhoneEvaluators[0].origin : ""
def privatePhoneEvaluatorTwoOrigin =
        privatePhoneEvaluators.size() == 2 ? privatePhoneEvaluators[1].origin : ""
def privatePhoneEvaluatorOnePublicKey =
        privatePhoneEvaluators.size() == 2 ? privatePhoneEvaluators[0].publicKeyHex : ""
def privatePhoneEvaluatorTwoPublicKey =
        privatePhoneEvaluators.size() == 2 ? privatePhoneEvaluators[1].publicKeyHex : ""
def privatePhoneDirectoryOrigin = privatePhoneSnapshotConfig?.origin ?: ""
def privatePhoneDirectoryPublicKey =
        privatePhoneSnapshotConfig?.directoryPublicKeyHex ?: ""
def privatePhoneVerificationPublicKey =
        privatePhoneSnapshotConfig?.verificationPublicKeyHex ?: ""
def privatePhoneMaximumSnapshotBytes =
        privatePhoneSnapshotConfig?.maximumBytes ?: 0
def moneroWalletExtraLibraries = (findProperty("moneroWalletExtraLibraries") ?: "").toString()
def moneroWalletExtraLibraryDirs = (findProperty("moneroWalletExtraLibraryDirs") ?: "").toString()
def moneroWalletExtraLinkOptions = (findProperty("moneroWalletExtraLinkOptions") ?: "").toString()
def moneroWalletExternalBuildDir = (findProperty("moneroWalletExternalBuildDir") ?: System.getenv("MONERO_WALLET_ANDROID_BUILD_DIR") ?: "").toString().trim()
def moneroWalletDiagnosticsEnabled = (
        findProperty("moneroWalletDiagnosticsEnabled")
                ?: System.getenv("MONERO_WALLET_DIAGNOSTICS")
                ?: "true"
).toString().trim().toBoolean()
def moneroWalletTransactionAuditEnabled = (
        findProperty("moneroWalletTransactionAuditEnabled")
                ?: System.getenv("MONERO_WALLET_TRANSACTION_AUDIT")
                ?: "false"
).toString().trim().toBoolean()
def uploadStoreFile = (System.getenv("MONERO_UPLOAD_STORE_FILE") ?: "").trim()
def uploadStorePassword = (System.getenv("MONERO_UPLOAD_STORE_PASSWORD") ?: "").trim()
def uploadKeyAlias = (System.getenv("MONERO_UPLOAD_KEY_ALIAS") ?: "").trim()
def uploadKeyPassword = (System.getenv("MONERO_UPLOAD_KEY_PASSWORD") ?: "").trim()
def hasUploadSigning = [
        uploadStoreFile,
        uploadStorePassword,
        uploadKeyAlias,
        uploadKeyPassword,
].every { !it.isEmpty() }

// Native Monero archives and Android's CMake intermediates are large. Keep
// generated output on the optional external build volume instead of allowing
// a development compile to exhaust the system disk. This affects only Gradle
// output; app sources, signing material, and wallet files stay in place.
if (!moneroWalletExternalBuildDir.isEmpty()) {
    layout.buildDirectory.set(file(moneroWalletExternalBuildDir))
}

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.monerowallet"
    defaultConfig {
        applicationId moneroWalletApplicationId
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // Increment for each shareable APK so Android accepts it as an update
        // over the previous locally installed release.
        versionCode mobileAppVersionManifest.androidVersionCode as int
        versionName mobileAppVersionManifest.versionName
        // Privacy-filtered lifecycle diagnostics remain available in release
        // builds so field failures can be diagnosed. The separate transaction
        // audit can contain linkable wallet data and stays explicit opt-in.
        buildConfigField "boolean", "WALLET_DIAGNOSTICS_ENABLED",
                moneroWalletDiagnosticsEnabled.toString()
        buildConfigField "boolean", "WALLET_TRANSACTION_AUDIT_ENABLED",
                moneroWalletTransactionAuditEnabled.toString()
        buildConfigField "String", "FAST_WALLET_GATEWAY_ORIGIN",
                groovy.json.JsonOutput.toJson(fastWalletGatewayOrigin)
        buildConfigField "String", "FAST_WALLET_REGISTRATION_ORIGIN",
                groovy.json.JsonOutput.toJson(fastWalletRegistrationOrigin)
        buildConfigField "String", "FAST_WALLET_OFFICIAL_WORKER_ROOT_ID",
                groovy.json.JsonOutput.toJson(fastWalletOfficialWorkerRootId)
        buildConfigField "boolean", "FAST_WALLET_OFFICIAL_WORKER_ENABLED",
                fastWalletOfficialWorkerEnabled.toString()
        buildConfigField "boolean", "FAST_WALLET_PRIVATE_WORKER_PAIRING_ENABLED",
                fastWalletPrivateWorkerPairingEnabled.toString()
        buildConfigField "boolean", "PRIVATE_PHONE_DEVICE_CONTACTS_ENABLED",
                privatePhoneDeviceContactsEnabled.toString()
        buildConfigField "boolean", "MONERO_ENTHUSIAST_V1_ENABLED",
                moneroEnthusiastV1Enabled.toString()
        buildConfigField "String", "MONERO_ENTHUSIAST_API_ORIGIN",
                groovy.json.JsonOutput.toJson(communityConfigValue("apiOrigin"))
        buildConfigField "String", "MONERO_ENTHUSIAST_MATRIX_HOMESERVER",
                groovy.json.JsonOutput.toJson(communityConfigValue("matrixHomeserver"))
        buildConfigField "String", "MONERO_ENTHUSIAST_CATALOG_ORIGIN",
                groovy.json.JsonOutput.toJson(communityConfigValue("catalogOrigin"))
        buildConfigField "String", "MONERO_ENTHUSIAST_CATALOG_SCOPE",
                groovy.json.JsonOutput.toJson(communityConfigValue("catalogScope"))
        buildConfigField "String", "MONERO_ENTHUSIAST_CATALOG_KEY_HEX",
                groovy.json.JsonOutput.toJson(communityConfigValue("catalogVerifyingKeyHex"))
        buildConfigField "String", "MONERO_ENTHUSIAST_ADVERTISING_ORIGIN",
                groovy.json.JsonOutput.toJson(communityConfigValue("advertisingOrigin"))
        buildConfigField "String", "MONERO_ENTHUSIAST_ADVERTISING_KEY_HEX",
                groovy.json.JsonOutput.toJson(communityConfigValue("advertisingVerifyingKeyHex"))
        buildConfigField "String", "MONERO_ENTHUSIAST_ADVERTISING_COUNTRY",
                groovy.json.JsonOutput.toJson(communityConfigValue("advertisingCountry"))
        buildConfigField "String", "MONERO_ENTHUSIAST_ARTIFACT_KEY_HEX",
                groovy.json.JsonOutput.toJson(communityConfigValue("artifactVerifyingKeyHex"))
        buildConfigField "String", "MONERO_ENTHUSIAST_ARTIFACT_MANIFEST_RESOURCE",
                groovy.json.JsonOutput.toJson(communityConfigValue("artifactManifestResource"))
        buildConfigField "String", "MONERO_ENTHUSIAST_PTE_RESOURCE",
                groovy.json.JsonOutput.toJson(communityConfigValue("pteResource"))
        buildConfigField "String", "MONERO_ENTHUSIAST_TOKENIZER_RESOURCE",
                groovy.json.JsonOutput.toJson(communityConfigValue("tokenizerResource"))
        buildConfigField "String", "MONERO_ENTHUSIAST_CONFORMANCE_RESOURCE",
                groovy.json.JsonOutput.toJson(communityConfigValue("conformanceResource"))
        buildConfigField "long", "PRIVATE_PHONE_EPOCH", "${privatePhoneEpoch}L"
        buildConfigField "String", "PRIVATE_PHONE_VERIFICATION_ORIGIN",
                groovy.json.JsonOutput.toJson(privatePhoneVerificationOrigin)
        buildConfigField "String", "PRIVATE_PHONE_EVALUATOR_ONE_ORIGIN",
                groovy.json.JsonOutput.toJson(privatePhoneEvaluatorOneOrigin)
        buildConfigField "String", "PRIVATE_PHONE_EVALUATOR_TWO_ORIGIN",
                groovy.json.JsonOutput.toJson(privatePhoneEvaluatorTwoOrigin)
        buildConfigField "String", "PRIVATE_PHONE_EVALUATOR_ONE_PUBLIC_KEY",
                groovy.json.JsonOutput.toJson(privatePhoneEvaluatorOnePublicKey)
        buildConfigField "String", "PRIVATE_PHONE_EVALUATOR_TWO_PUBLIC_KEY",
                groovy.json.JsonOutput.toJson(privatePhoneEvaluatorTwoPublicKey)
        buildConfigField "String", "PRIVATE_PHONE_DIRECTORY_ORIGIN",
                groovy.json.JsonOutput.toJson(privatePhoneDirectoryOrigin)
        buildConfigField "String", "PRIVATE_PHONE_DIRECTORY_PUBLIC_KEY",
                groovy.json.JsonOutput.toJson(privatePhoneDirectoryPublicKey)
        buildConfigField "String", "PRIVATE_PHONE_VERIFICATION_PUBLIC_KEY",
                groovy.json.JsonOutput.toJson(privatePhoneVerificationPublicKey)
        buildConfigField "int", "PRIVATE_PHONE_MAXIMUM_SNAPSHOT_BYTES",
                privatePhoneMaximumSnapshotBytes.toString()
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        externalNativeBuild {
            cmake {
                cppFlags "-std=c++17 -fexceptions -frtti"
                arguments "-DMONERO_WALLET_BRIDGE_WITH_MONERO=${moneroWalletBridgeWithMonero ? "ON" : "OFF"}",
                        "-DMONERO_WALLET_DIAGNOSTICS=${moneroWalletDiagnosticsEnabled ? "ON" : "OFF"}",
                        "-DMONERO_SOURCE_DIR=${moneroSourceDir}",
                        "-DMONERO_WALLET_LINK_MANIFEST=${moneroWalletLinkManifest}",
                        "-DMONERO_WALLET_LINK_ROOT=${moneroWalletLinkRoot}",
                        "-DMONERO_WALLET_API_LIBRARY=${moneroWalletApiLibrary}",
                        "-DMONERO_WALLET_API_ROOT=${moneroWalletApiRoot}",
                        "-DMONERO_FAST_CRYPTO_LIBRARY=${moneroFastCryptoLibrary}",
                        "-DMONERO_FAST_CRYPTO_ROOT=${moneroFastCryptoRoot}",
                        "-DMONERO_FAST_WALLET_PROTOCOL_LIBRARY=${moneroFastWalletProtocolLibrary}",
                        "-DMONERO_FAST_WALLET_PROTOCOL_ROOT=${moneroFastWalletProtocolRoot}",
                        "-DMONERO_COMMUNITY_MATRIX_LIBRARY=${moneroCommunityMatrixLibrary}",
                        "-DMONERO_COMMUNITY_MATRIX_ROOT=${moneroCommunityMatrixRoot}",
                        "-DMONERO_COMMUNITY_HARRIER_LIBRARY=${moneroCommunityHarrierLibrary}",
                        "-DMONERO_ENTHUSIAST_V1_ENABLED=${moneroEnthusiastV1Enabled ? "ON" : "OFF"}",
                        "-DMONERO_WALLET_EXTRA_LIBRARIES=${moneroWalletExtraLibraries}",
                        "-DMONERO_WALLET_EXTRA_LIBRARY_DIRS=${moneroWalletExtraLibraryDirs}",
                        "-DMONERO_WALLET_EXTRA_LINK_OPTIONS=${moneroWalletExtraLinkOptions}"
            }
        }
    }

    if (moneroEnthusiastV1Enabled) {
        if (moneroCommunityHarrierJniLibs.isEmpty()) {
            throw new GradleException(
                    "Monero Enthusiast V1 requires the packaged Android Harrier shared library"
            )
        }
        sourceSets {
            main {
                assets.srcDir(moneroCommunityAssetRoot)
                jniLibs.srcDir(moneroCommunityHarrierJniLibs)
            }
        }
        androidResources {
            noCompress += ["pte"]
        }
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        release {
            if (hasUploadSigning) {
                storeFile file(uploadStoreFile)
                storePassword uploadStorePassword
                keyAlias uploadKeyAlias
                keyPassword uploadKeyPassword
            }
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            if (hasUploadSigning) {
                signingConfig signingConfigs.release
            }
            minifyEnabled enableProguardInReleaseBuilds
            shrinkResources enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
    }
    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            // AGP keeps CMake's staging directory outside layout.buildDirectory
            // by default (<module>/.cxx). Relocate it as well when an external
            // build volume is configured, otherwise a full native Monero link
            // can still exhaust the internal macOS disk.
            if (!moneroWalletExternalBuildDir.isEmpty()) {
                buildStagingDirectory file("${moneroWalletExternalBuildDir}-cxx")
            }
        }
    }
}

gradle.taskGraph.whenReady { graph ->
    def requestedReleaseBuild = graph.allTasks.any {
        it.path == ":app:bundleRelease" || it.path == ":app:assembleRelease"
    }
    if (requestedReleaseBuild && !hasUploadSigning) {
        throw new GradleException(
                "Release signing is required. Run scripts/android-play-bundle.sh or set MONERO_UPLOAD_* environment variables."
        )
    }
}

dependencies {
    // The version of react-native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")
    // Use the lifecycle-aware AndroidX prompt. The platform prompt can be
    // launched before React's activity has focus and then remain invisible.
    implementation("androidx.biometric:biometric:1.1.0")
    implementation("androidx.core:core-ktx:1.13.1")
    implementation("com.lambdapioneer.argon2kt:argon2kt:1.6.0")
    // Start Tor only when an Onion daemon is selected. The service is bound
    // lazily from React Native, so loading libtor never delays app startup.
    implementation("info.guardianproject:tor-android:0.4.9.11")
    if (moneroEnthusiastV1Enabled) {
        // Version pinned in native/community-harrier-runtime/upstream.lock.
        implementation("org.pytorch:executorch-android:1.3.1")
    }
    testImplementation("junit:junit:4.13.2")

    androidTestImplementation("androidx.test:core:1.6.1")
    androidTestImplementation("androidx.test:runner:1.6.2")
    androidTestImplementation("androidx.test.ext:junit:1.2.1")
    androidTestImplementation("junit:junit:4.13.2")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}
