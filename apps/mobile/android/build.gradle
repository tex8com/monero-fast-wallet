buildscript {
    ext {
        buildToolsVersion = "36.0.0"
        minSdkVersion = 24
        compileSdkVersion = 36
        targetSdkVersion = 36
        ndkVersion = "27.1.12297006"
        kotlinVersion = "2.1.20"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle:8.12.0")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:2.1.20")
        classpath("com.google.gms:google-services:4.4.4")
    }
}

apply plugin: "com.facebook.react.rootproject"

project(":app") {
    def developmentDependencyLockingLenient = (
            findProperty("moneroDevelopmentDependencyLockingLenient") ?: "false"
    ).toString().toBoolean()
    def configuredApplicationId = (
            findProperty("moneroWalletApplicationId") ?: "com.tex8.monerowallet"
    ).toString()
    if (developmentDependencyLockingLenient &&
            configuredApplicationId == "com.tex8.monerowallet") {
        throw new GradleException(
                "Lenient dependency locking is allowed only for a separate development application ID"
        )
    }
    dependencyLocking {
        lockAllConfigurations()
        lockMode = developmentDependencyLockingLenient
                ? LockMode.LENIENT
                : LockMode.STRICT
    }
}
