[package]
name = "monero-wallet-desktop"
version = "0.1.0"
description = "Monero Fast Wallet desktop host"
authors = ["Tex8"]
edition = "2021"
rust-version = "1.77"
default-run = "monero-wallet-desktop"

[lib]
name = "monero_wallet_desktop"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
cc = "1.2"
tauri-build = { version = "2.4", features = [] }

[dependencies]
getrandom = "0.2"
keyring = "3.6"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.8", features = [] }
tauri-plugin-notification = "2.3.3"
zeroize = { version = "1.8", features = ["derive"] }

[target.'cfg(target_os = "linux")'.dependencies]
notify-rust = "4.11"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.58", features = ["Foundation", "Networking_PushNotifications"] }

[[bin]]
name = "monero-fast-walletd"
path = "src/bin/monero-fast-walletd.rs"
