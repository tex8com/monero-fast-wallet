[package]
name = "monero-wallet-desktop"
version = "0.1.0"
description = "Monero Fast Wallet desktop host"
authors = ["Tex8"]
edition = "2021"
license = "MPL-2.0"
rust-version = "1.77"
default-run = "monero-wallet-desktop"

[lib]
name = "monero_wallet_desktop"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
cc = "1.2"
serde_json = "1"
tauri-build = { version = "2.4", features = [] }

[dependencies]
argon2 = "0.5"
base64 = "0.22"
chacha20poly1305 = { version = "0.10", features = ["std"] }
community-matrix-core = { path = "../../../native/community-matrix-core" }
community-runtime-core = { path = "../../../native/community-runtime-core", features = ["native-harrier"] }
ed25519-dalek = "2"
fast-wallet-protocol = { path = "../../../native/fast-wallet-protocol" }
mfw-product-core = { path = "../../../native/product-core" }
getrandom = "0.2"
hex = "0.4"
# Explicitly select real platform credential stores. Without these features
# keyring falls back to an in-memory mock on macOS, which makes a newly
# created wallet impossible to reopen after the app process exits.
keyring = { version = "3.6", features = ["apple-native", "windows-native", "linux-native-sync-persistent", "crypto-rust"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2.8", features = [] }
tauri-plugin-notification = "2.3.3"
tauri-plugin-process = "2.3.1"
tauri-plugin-single-instance = "2.4.3"
tauri-plugin-updater = "2.10.1"
tungstenite = { version = "0.24", default-features = false, features = ["handshake", "rustls-tls-webpki-roots"] }
zeroize = { version = "1.8", features = ["derive"] }
unicode-normalization = "0.1"

[target.'cfg(target_os = "macos")'.dependencies]
# Apple recommends SecItem + the Data Protection Keychain for current macOS
# apps. The generic keyring macOS provider still targets the legacy
# file-based Keychain, whose per-binary ACL cannot recognize rebuilt ad-hoc
# Tauri development executables.
security-framework = { version = "3.7", features = ["OSX_10_15"] }

[target.'cfg(target_os = "linux")'.dependencies]
futures-timer = "3.0"
futures-util = "0.3"
gtk = "0.18"
notify-rust = "4.11"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
zbus = "5.18"

[target.'cfg(target_os = "windows")'.dependencies]
notify-rust = "4.11"
raw-window-handle = "0.6"

[[bin]]
name = "monero-fast-walletd"
path = "src/bin/monero-fast-walletd.rs"
