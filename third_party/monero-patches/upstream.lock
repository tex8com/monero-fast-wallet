# Patch 0070 uses pkg-config's static gRPC closure whenever the Core libraries
# are static, even when Monero's optional full-static executable mode is off;
# it also stamps the current patch-count default in the standalone product CLI.
# Patch 0071 keeps one global exact-range downloader while restoring four
# bounded process-wide HTTP/2 transport lanes instead of collapsing all
# logical range clients onto one channel.
# Patch 0072 separates the 2048-block finite range span from the bounded
# 16..512-block response chunk hint, removing repeated WAN reopen latency.
# Patch 0073 benchmarks the verified CPU and platform GPU derivation backends
# once per process and reports the actual backend used by every scan batch.
# Patch 0074 removes only high-frequency diagnostic clocks and TxID hot-path
# logs; aggregate phase telemetry and wallet behavior remain unchanged.
# Patch 0075 adds a capability-safe persistent striped gRPC method. Four
# bounded lanes cover every public block exactly once; old servers can only
# trigger the explicit pre-first-chunk UNIMPLEMENTED fallback.
# Patch 0076 makes Ledger HID reads fail closed on timeout; it is independent
# of the gRPC lane sizing correction in patch 0075.
# Patch 0077 exposes only aggregate byte and derivation counters, renders live
# block/network/scan rates in the product CLI, and gives both graphical apps
# the same measured wallet-scan source without exposing wallet material.
# Patch 0078 accepts a clean persistent-lane end after the shared cursor has
# moved strictly above the last authenticated chain tip, plus wallet2's empty
# one-height probe at its already-known daemon height. Historical gaps remain
# hard errors.
# Patch 0079 raises the one global persistent gRPC downloader from four to six
# disjoint lanes after a physical Pixel full-range raw transport test measured
# 40.300476 MiB/s with four and 59.588780 MiB/s with six. Wallet scan,
# derivations, ordering, and the bounded per-lane queues remain unchanged.
# Patch 0080 retains the one-chunk RAM hot buffer and spills additional public
# BlockStream payloads to an app-private bounded disk queue. Integrity failure,
# missing storage, or a full quota falls back to the previous RAM backpressure
# path; wallet scans, keys, ownership decisions, and ordering are unchanged.
# Patch 0081 lets the product CLI verify and list Directory-approved public
# Community Workers, pin one exact Worker ID, or add a non-public Worker from
# its signed descriptor. Public enrollment refreshes its descriptor from the
# Directory; private enrollment remains descriptor-file based.
# Patch 0082 keeps the automatic backend-selection probe short, but runs every
# supported backend in the explicit Settings testbench for ten seconds in
# deterministic CPU, Metal, CUDA order.
# Patch 0083 exposes Core's existing exact per-subaddress balance map through
# the public Wallet API so product clients never estimate address balances
# from incomplete transaction history.
# Patch 0084 adds the product `community` command and dispatches it only to the
# packaged Rust Community V1 companion beside the current executable. It never
# resolves a companion through PATH and does not alter upstream wallet flows.
# Patch 0085 seeds the keyless shared provider with canonical public genesis
# while keeping its account uninitialised. Shared gRPC ranges use their exact
# explicit cursor without a synthetic locator; authenticated bin-RPC fallback
# retains the valid genesis locator.
# Patch 0086 preserves the incremental automatic Ledger key-image fast path
# while adding an explicit full spent-status recheck for the Settings action.
# Patch 0087 checkpoints successful Ledger key-image derivations before node
# verification, retries cached key images without hardware, and batches
# restricted /gettransactions lookups to the node limit of 100 hashes.
# Patch 0088 keeps the documented product --debug flag working despite the
# extended --debug-* option family by normalizing it before Boost parses it.
# Patch 0089 primes the user-approved Ledger private view key once per connected
# hardware session before shared scanning, so parsing remains local instead of
# issuing one BLE APDU for every public transaction key.
# Patch 0090 reuses that already-approved key directly from the encrypted local
# view-only companion for signing-wallet scans. Both master public keys and the
# derived public view key must match before the secret is installed in memory.
# Patch 0091 exposes one local-only soft cache reset for the shared-sync owner.
# Unlike Wallet::rescanBlockchain(), it cannot silently skip the reset merely
