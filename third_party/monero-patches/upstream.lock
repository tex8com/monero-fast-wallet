# Patch 0092 couples a successfully identity-checked companion view-key prime
# to Ledger transaction-parse mode and fails the scan preparation if that mode
# cannot be established and verified.
# Patch 0093 restores device-token derivation after that prime. The targeted
# Key-Image path must receive Ledger's encrypted TYPE_DERIVATION token; sending
# a host-clear parse-mode derivation back to the device corrupts the ephemeral
# output binding even when the APDU itself returns success.
# Patch 0094 lets mobile clients select the currently connected Ledger USB or
# BLE transport before an existing hardware wallet initializes. The encrypted
