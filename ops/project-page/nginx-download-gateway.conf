# Privacy-minimised project-page counters and release downloads. These routes
# deliberately write no Nginx access log; the gateway stores aggregates only.
location = /v1/mfw-site/page-view {
    limit_except POST { deny all; }
    client_max_body_size 512;
    access_log off;
    proxy_pass http://127.0.0.1:8097;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For "";
    proxy_set_header Referer "";
    proxy_connect_timeout 2s;
    proxy_read_timeout 5s;
}

location = /v1/mfw-site/releases {
    limit_except GET { deny all; }
    access_log off;
    proxy_pass http://127.0.0.1:8097;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For "";
    proxy_set_header Referer "";
    proxy_connect_timeout 2s;
    proxy_read_timeout 5s;
}

location = /v1/mfw-site/healthz {
    limit_except GET { deny all; }
    access_log off;
    proxy_pass http://127.0.0.1:8097;
    proxy_http_version 1.1;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For "";
    proxy_set_header Referer "";
    proxy_connect_timeout 2s;
    proxy_read_timeout 5s;
}

location ~ "^/download/(?<mfw_product>mfw|mfn)/(?<mfw_platform>android|ios|macos|windows|linux)/(?<mfw_package>apk|appstore|dmg|exe|msix|rpm|deb|appimage|tar\.gz|zip)$" {
    limit_except GET { deny all; }
    access_log off;
    proxy_pass http://127.0.0.1:8097;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For "";
    proxy_set_header Referer "";
    proxy_connect_timeout 2s;
    proxy_read_timeout 5s;
}

location ~ "^/release-assets/(?<mfw_artifact_sha>[0-9a-f]{64})/(?<mfw_artifact_name>[A-Za-z0-9][A-Za-z0-9._+-]{0,159})$" {
    access_log off;
    alias /var/www/mfw-downloads/$mfw_artifact_sha/$mfw_artifact_name;
    default_type application/octet-stream;
    add_header Content-Disposition "attachment" always;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options "nosniff" always;
}

# Server 2 downloads only this public manifest and hash-addressed release data.
location = /mfw-download-mirror/releases.json {
    access_log off;
    alias /var/www/mfw-downloads/releases.json;
    default_type application/json;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
}

location ~ "^/mfw-download-mirror/releases/(?<mfw_mirror_sha>[0-9a-f]{64})/(?<mfw_mirror_name>[A-Za-z0-9][A-Za-z0-9._+-]{0,159})$" {
    access_log off;
    alias /var/www/mfw-downloads/$mfw_mirror_sha/$mfw_mirror_name;
    default_type application/octet-stream;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options "nosniff" always;
}
