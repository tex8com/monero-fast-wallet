# React project page. Product APIs are provided by their dedicated services.
location = / {
    access_log off;
    root /var/www/monero-fast-wallet.current;
    try_files /index.html =404;
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}

location = /de {
    access_log off;
    return 301 /de/;
}

location = /de/ {
    access_log off;
    root /var/www/monero-fast-wallet.current;
    try_files /de/index.html =404;
    add_header Cache-Control "no-cache" always;
}

location ~ ^/(es|pt-br|ru|vi|id|uk|tr|hi|ur|fr|fil|ja|ko|ar|zh-cn|zh-tw)$ {
    access_log off;
    return 301 $uri/;
}

location ~ ^/(?<mfw_locale>es|pt-br|ru|vi|id|uk|tr|hi|ur|fr|fil|ja|ko|ar|zh-cn|zh-tw)/$ {
    access_log off;
    root /var/www/monero-fast-wallet.current;
    try_files /$mfw_locale/index.html =404;
    add_header Cache-Control "no-cache" always;
}

location = /en {
    access_log off;
    return 301 /;
}

location = /en/ {
    access_log off;
    return 301 /;
}

location = /developers {
    access_log off;
    return 301 /developers/;
}

location = /developers/ {
    access_log off;
    root /var/www/monero-fast-wallet.current;
    try_files /developers/index.html =404;
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
}

location = /de/developers {
    access_log off;
    return 301 /de/developers/;
}

location = /de/developers/ {
    access_log off;
    root /var/www/monero-fast-wallet.current;
    try_files /de/developers/index.html =404;
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
}

location = /privacy {
    access_log off;
    return 301 /privacy/;
}

location = /privacy/ {
    access_log off;
    root /var/www/monero-fast-wallet.current;
    try_files /privacy/index.html =404;
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
}

location = /de/datenschutz {
    access_log off;
    return 301 /de/datenschutz/;
}

location = /de/datenschutz/ {
    access_log off;
    root /var/www/monero-fast-wallet.current;
    try_files /de/datenschutz/index.html =404;
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
}

location = /robots.txt {
    access_log off;
    root /var/www/monero-fast-wallet.current;
    try_files /robots.txt =404;
    add_header Cache-Control "public, max-age=3600" always;
}

location = /sitemap.xml {
    access_log off;
    root /var/www/monero-fast-wallet.current;
    try_files /sitemap.xml =404;
    add_header Cache-Control "public, max-age=3600" always;
}

location = /monero-wallet-logo.svg {
    access_log off;
    root /var/www/monero-fast-wallet.current;
    try_files /monero-wallet-logo.svg =404;
    add_header Cache-Control "public, max-age=86400" always;
    add_header X-Content-Type-Options "nosniff" always;
}

# Display-only owner-published COMMIT tracking. It contains no salt, private
# key, signed CLAIM, or wallet material and never participates in resolution.
location = /mfw-registration-tracking.json {
    access_log off;
    root /var/www/monero-fast-wallet.current;
    try_files /mfw-registration-tracking.json =404;
    default_type application/json;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
}

location ^~ /assets/ {
    access_log off;
    root /var/www/monero-fast-wallet.current;
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options "nosniff" always;
}

# Server 2 polls this small manifest and downloads only the referenced,
# immutable public-site archive. No repository or deployment secret is served.
location = /mfw-mirror/current {
    access_log off;
    alias /var/www/monero-fast-wallet-mirror/current;
    default_type text/plain;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
}

location ~ "^/mfw-mirror/releases/(?<mfw_release_sha>[0-9a-f]{64})\.tar\.gz$" {
    access_log off;
    alias /var/www/monero-fast-wallet-mirror/releases/$mfw_release_sha.tar.gz;
    default_type application/gzip;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options "nosniff" always;
}

location = /api/assistant/stream {
    limit_except POST { deny all; }
    limit_req zone=mfw_assistant_per_ip burst=5 nodelay;
    limit_conn mfw_assistant_connections 4;
    client_max_body_size 24k;
    access_log off;

    proxy_pass http://127.0.0.1:3010/api/v1/chat/stream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP "";
    proxy_set_header X-Forwarded-For "";
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 120s;
    add_header X-Accel-Buffering "no" always;
}

location = /healthz {
    access_log off;
    default_type application/json;
    return 200 '{"status":"ok","service":"mfw-project-page"}\n';
}

include /etc/nginx/snippets/mfw-download-gateway.conf;
