# React project page. Scanner, health, and Fast Wallet routes remain separate.
location = / {
    root /var/www/monero-fast-wallet.current;
    try_files /index.html =404;
    add_header Cache-Control "public, max-age=300" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}

location = /de {
    return 301 /de/;
}

location = /de/ {
    root /var/www/monero-fast-wallet.current;
    try_files /de/index.html =404;
    add_header Cache-Control "public, max-age=300" always;
}

location ~ ^/(es|pt-br|ru|vi|id|uk|tr|hi|ur|fr|fil|ja|ko|ar|zh-cn|zh-tw)$ {
    return 301 $uri/;
}

location ~ ^/(?<mfw_locale>es|pt-br|ru|vi|id|uk|tr|hi|ur|fr|fil|ja|ko|ar|zh-cn|zh-tw)/$ {
    root /var/www/monero-fast-wallet.current;
    try_files /$mfw_locale/index.html =404;
    add_header Cache-Control "public, max-age=300" always;
}

location = /en {
    return 301 /;
}

location = /en/ {
    return 301 /;
}

location = /robots.txt {
    root /var/www/monero-fast-wallet.current;
    try_files /robots.txt =404;
    add_header Cache-Control "public, max-age=3600" always;
}

location = /sitemap.xml {
    root /var/www/monero-fast-wallet.current;
    try_files /sitemap.xml =404;
    add_header Cache-Control "public, max-age=3600" always;
}

location = /monero-wallet-logo.svg {
    root /var/www/monero-fast-wallet.current;
    try_files /monero-wallet-logo.svg =404;
    add_header Cache-Control "public, max-age=86400" always;
    add_header X-Content-Type-Options "nosniff" always;
}

location ^~ /assets/ {
    root /var/www/monero-fast-wallet.current;
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options "nosniff" always;
}

location = /api/assistant/stream {
    limit_except POST { deny all; }
    limit_req zone=mfw_assistant_per_ip burst=5 nodelay;
    limit_conn mfw_assistant_connections 4;
    client_max_body_size 24k;

    proxy_pass http://127.0.0.1:3010/api/v1/chat/stream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 120s;
    add_header X-Accel-Buffering "no" always;
}

location = /healthz {
    proxy_pass http://127.0.0.1:8087/healthz;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# Match injection is a loopback-only operator path and must never traverse the
# public reverse proxy, even when an internal token is configured.
location = /v1/fast-receive/matches {
    return 404;
}

location /v1/fast-receive/ {
    client_max_body_size 96k;
    limit_req zone=notify_scanner_per_ip burst=20 nodelay;
    limit_conn notify_scanner_connections 10;
    proxy_pass http://127.0.0.1:8087/v1/fast-receive/;
    proxy_http_version 1.1;
    proxy_connect_timeout 3s;
    proxy_read_timeout 30s;
    proxy_send_timeout 10s;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
