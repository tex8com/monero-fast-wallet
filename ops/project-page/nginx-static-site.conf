# Static Monero Fast Wallet project page shared by Clearnet and Tor web ingress.
# Product APIs use separate, explicit locations and raw wallet RPC remains on
# port 18089. Static page requests are counted only through the aggregate
# page-view endpoint, so Nginx access logging is disabled here.
location = / {
    access_log off;
    root /var/www/monero-fast-wallet.current;
    try_files /index.html =404;
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
}

location = /de { access_log off; return 308 /de/; }
location = /en { access_log off; return 308 /; }
location = /en/ { access_log off; return 308 /; }

location ~ ^/(es|pt-br|ru|vi|id|uk|tr|hi|ur|fr|fil|ja|ko|ar|zh-cn|zh-tw)$ {
    access_log off;
    return 308 $uri/;
}

location ~ ^/(?<mfw_public_locale>de|es|pt-br|ru|vi|id|uk|tr|hi|ur|fr|fil|ja|ko|ar|zh-cn|zh-tw)/$ {
    access_log off;
    root /var/www/monero-fast-wallet.current;
    try_files /$mfw_public_locale/index.html =404;
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
}

location = /developers { access_log off; return 308 /developers/; }
location = /de/developers { access_log off; return 308 /de/developers/; }
location = /privacy { access_log off; return 308 /privacy/; }
location = /de/datenschutz { access_log off; return 308 /de/datenschutz/; }

location = /developers/ {
    access_log off;
    root /var/www/monero-fast-wallet.current;
    try_files /developers/index.html =404;
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
}

location = /de/developers/ {
    access_log off;
    root /var/www/monero-fast-wallet.current;
    try_files /de/developers/index.html =404;
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
}

location = /privacy/ {
    access_log off;
    root /var/www/monero-fast-wallet.current;
    try_files /privacy/index.html =404;
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
}

location = /de/datenschutz/ {
    access_log off;
    root /var/www/monero-fast-wallet.current;
    try_files /de/datenschutz/index.html =404;
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
}

location = /robots.txt {
    access_log off;
    root /var/www/monero-fast-wallet.current;
    try_files /robots.txt =404;
    add_header Cache-Control "public, max-age=3600" always;
}

location = /sitemap.xml {
    access_log off;
    root /var/www/monero-fast-wallet.current;
    try_files /sitemap.xml =404;
    add_header Cache-Control "public, max-age=3600" always;
}

location = /monero-wallet-logo.svg {
    access_log off;
    root /var/www/monero-fast-wallet.current;
    try_files /monero-wallet-logo.svg =404;
    add_header Cache-Control "public, max-age=86400" always;
    add_header X-Content-Type-Options "nosniff" always;
}

location = /mfw-registration-tracking.json {
    access_log off;
    root /var/www/monero-fast-wallet.current;
    try_files /mfw-registration-tracking.json =404;
    default_type application/json;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
}

location ^~ /assets/ {
    access_log off;
    root /var/www/monero-fast-wallet.current;
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options "nosniff" always;
}

include /etc/nginx/snippets/mfw-download-gateway.conf;
