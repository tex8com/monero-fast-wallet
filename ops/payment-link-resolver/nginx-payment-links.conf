# Include this file inside the xmr.tex8.com server block. The rate-limit
# zones are declared separately in nginx-payment-link-rate-limits.conf.

location = /.well-known/assetlinks.json {
    limit_except GET { deny all; }
    proxy_pass http://127.0.0.1:8098;
    include /etc/nginx/proxy_params;
}

location = /.well-known/apple-app-site-association {
    limit_except GET { deny all; }
    proxy_pass http://127.0.0.1:8098;
    include /etc/nginx/proxy_params;
}

location = /v1/payment-requests {
    limit_except POST OPTIONS { deny all; }
    limit_req zone=mfw_payment_create burst=4 nodelay;
    client_max_body_size 2k;
    proxy_pass http://127.0.0.1:8098;
    include /etc/nginx/proxy_params;
}

location ^~ /v1/payment-requests/ {
    limit_except GET OPTIONS { deny all; }
    limit_req zone=mfw_payment_read burst=20 nodelay;
    proxy_pass http://127.0.0.1:8098;
    include /etc/nginx/proxy_params;
}

location ^~ /pay/ {
    limit_except GET { deny all; }
    limit_req zone=mfw_payment_read burst=20 nodelay;
    proxy_pass http://127.0.0.1:8098;
    include /etc/nginx/proxy_params;
}
