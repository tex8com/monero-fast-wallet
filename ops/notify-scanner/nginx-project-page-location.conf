# Static public project page. API and service routes remain in their dedicated
# Nginx locations and continue to be handled by the corresponding services.
location = / {
    root /var/www/monero-fast-wallet;
    try_files /index.html =404;
    add_header Cache-Control "public, max-age=300" always;
}

location = /healthz {
    proxy_pass http://127.0.0.1:8087/healthz;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location /v1/fast-receive/ {
    proxy_pass http://127.0.0.1:8087/v1/fast-receive/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
