# Loaded in nginx's http context through /etc/nginx/conf.d.
# The application also applies a per-capability limit; this outer limit stops
# unauthenticated clients from creating unbounded work with fresh tokens.
limit_req_zone $binary_remote_addr zone=notify_scanner_per_ip:10m rate=30r/m;
limit_conn_zone $binary_remote_addr zone=notify_scanner_connections:10m;
limit_req_zone $binary_remote_addr zone=mfw_assistant_per_ip:10m rate=12r/m;
limit_conn_zone $binary_remote_addr zone=mfw_assistant_connections:10m;
