location = / {
    proxy_pass http://127.0.0.1:8087/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location = /healthz {
    proxy_pass http://127.0.0.1:8087/healthz;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# Match injection is a loopback-only operator path. It must never traverse the
# public reverse proxy, even when an internal token is configured.
location = /v1/fast-receive/matches {
    return 404;
}

location /v1/fast-receive/ {
    client_max_body_size 96k;
    limit_req zone=notify_scanner_per_ip burst=20 nodelay;
    limit_conn notify_scanner_connections 10;
    proxy_pass http://127.0.0.1:8087/v1/fast-receive/;
    proxy_http_version 1.1;
    proxy_connect_timeout 3s;
    proxy_read_timeout 30s;
    proxy_send_timeout 10s;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
