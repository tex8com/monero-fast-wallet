# Dedicated Stagenet Cuprate for wallet-sync benchmarks.
# It shares the existing WireGuard address with TEX8 services, but has its own
# ports and independent storage. It never touches the production Cuprate.
network = "Stagenet"
fast_sync = true

[tracing.stdout]
level = "info"

[tracing.file]
level = "debug"
max_log_files = 3

[tokio]
threads = 2

[rayon]
threads = 2

[p2p.clear_net]
enable_inbound = false
listen_on = "127.0.0.1"
enable_inbound_v6 = false
listen_on_v6 = "::"
p2p_port = 48080
outbound_connections = 8
extra_outbound_connections = 1
max_inbound_connections = 0
gray_peers_percent = 0.7

[rpc.unrestricted]
i_know_what_im_doing_allow_public_unrestricted_rpc = false
address = "127.0.0.1"
port = 48081
enable = false

[rpc.restricted]
advertise = false
# Safe public-repository default: loopback only. Deployers that need WireGuard
# access must provide a private local config with their own bind address.
address = "127.0.0.1"
port = 48089
enable = true

[rpc.grpc]
address = "127.0.0.1"
port = 48091
enable = true
i_know_what_im_doing_allow_public_grpc = false

[storage]
reader_threads = 2

[storage.txpool]
max_txpool_byte_size = 25_000_000
maximum_age_secs = 86400

[fs]
data_directory = "/srv/mfw-cuprate-sync-benchmark/data"
cache_directory = "/srv/mfw-cuprate-sync-benchmark/cache"

[tor.arti]
directory_path = "/srv/mfw-cuprate-sync-benchmark/arti"
isolated_circuit = false
onion_service_pow = false
