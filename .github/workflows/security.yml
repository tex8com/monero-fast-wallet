name: Security verification

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '17 3 * * 6'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  supply-chain-contract:
    name: Supply-chain pinning contract
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.18.0
      - run: ./scripts/check-supply-chain-contract.sh
      - run: ./scripts/check-scanner-security-contract.sh
      - run: node --test ./scripts/test-product-locales.mjs

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5
        with:
          fail-on-severity: moderate

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  javascript-mobile:
    name: Mobile JavaScript security contracts
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.18.0
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - name: Install exact npm
        run: npm install --global npm@11.16.0
      - run: npm ci
      - run: npm audit --audit-level=moderate
      - run: npm run test:security

  javascript-desktop:
    name: Desktop JavaScript security contracts
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.18.0
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Install exact npm
        run: npm install --global npm@11.16.0
      - run: npm ci
      - run: npm audit --audit-level=moderate
      - run: npm run check
      - run: npm run test:parity-contract
      - run: npm run test:push-contract
      - run: npm run test:platform-contract
      - run: npm run test:wallet-contract

  rust-security:
    name: Rust advisory policy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install exact Rust toolchain
        run: |
          rustup toolchain install 1.97.0 --profile minimal
          rustup default 1.97.0
      - name: Install exact cargo-audit
        run: cargo install cargo-audit --version 0.22.2 --locked
      - run: ./scripts/check-rust-security.sh

  rust-services:
    name: ${{ matrix.name }} Rust tests
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: enthusiast-discovery
            manifest: services/enthusiast-discovery/Cargo.toml
          - name: enthusiast-v1
            manifest: services/enthusiast-v1/Cargo.toml
          - name: community-search-core
            manifest: packages/community-search-core/Cargo.toml
          - name: community-runtime-core
            manifest: native/community-runtime-core/Cargo.toml
          - name: monero-news
            manifest: services/monero-news/Cargo.toml
          - name: notification-gateway
            manifest: services/notification-gateway/Cargo.toml
          - name: notification-registration-adapter
            manifest: services/notification-registration-adapter/Cargo.toml
          - name: notify-scanner
            manifest: services/notify-scanner/Cargo.toml
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install exact Rust toolchain
        run: |
          rustup toolchain install 1.97.0 --profile minimal
          rustup default 1.97.0
      - run: cargo test --locked --manifest-path ${{ matrix.manifest }}

  cuprate:
    name: Cuprate locked compile
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: node/cuprate
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install exact Rust toolchain
        run: |
          rustup toolchain install 1.97.0 --profile minimal
          rustup default 1.97.0
      - name: Install protobuf compiler
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - run: cargo check --locked -p cuprated

  android-build-integrity:
    name: Android locked and verified compile
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.18.0
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Install exact npm
        run: npm install --global npm@11.16.0
      - run: npm ci
      - run: npm run test:build-integrity
      - run: ./gradlew --no-daemon compileDebugKotlin compileReleaseKotlin
        working-directory: apps/mobile/android

  native-bridge:
    name: Native boundary ASan/UBSan tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: cmake -S native/monero-bridge -B build/security-native -DMONERO_WALLET_BRIDGE_WITH_MONERO=OFF -DMONERO_WALLET_BRIDGE_ENABLE_SANITIZERS=ON
      - run: cmake --build build/security-native --parallel 2
      - run: ctest --test-dir build/security-native --output-on-failure

  codeql:
    name: CodeQL ${{ matrix.language }}
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, java-kotlin]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: github/codeql-action/init@4187e74d05793876e9989daffde9c3e66b4acd07 # v3
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - uses: github/codeql-action/analyze@4187e74d05793876e9989daffde9c3e66b4acd07 # v3
        with:
          category: /language:${{ matrix.language }}

  sbom:
    name: Generate repository SBOM
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: .
          format: cyclonedx-json
          output-file: tex8-repository-sbom.cdx.json
          upload-artifact: false
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tex8-repository-sbom
          path: tex8-repository-sbom.cdx.json
          if-no-files-found: error
          retention-days: 30
