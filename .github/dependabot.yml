version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: npm
    directory: /wallets/mobile
    schedule:
      interval: weekly
    groups:
      mobile-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /wallets/desktop
    schedule:
      interval: weekly
    groups:
      desktop-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: bundler
    directory: /wallets/mobile
    schedule:
      interval: weekly

  - package-ecosystem: gradle
    directory: /wallets/mobile/android
    schedule:
      interval: weekly

  - package-ecosystem: cargo
    directory: /wallets/desktop/src-tauri
    schedule:
      interval: weekly

  - package-ecosystem: cargo
    directory: /node/mfn-monero-fast-node
    schedule:
      interval: weekly

  - package-ecosystem: cargo
    directory: /backend/enthusiast-discovery
    schedule:
      interval: weekly

  - package-ecosystem: cargo
    directory: /backend/monero-news
    schedule:
      interval: weekly

  - package-ecosystem: cargo
    directory: /backend/notification-gateway
    schedule:
      interval: weekly

  - package-ecosystem: cargo
    directory: /backend/fast-wallet-worker/scanner-core
    schedule:
      interval: weekly
