[package]
name = "enthusiast-v1"
version = "0.1.0"
edition = "2021"
publish = false
license = "AGPL-3.0-only"

[dependencies]
async-trait = "0.1"
axum = { version = "0.8", features = ["http1", "json", "query", "tokio"], default-features = false }
community-chat-report-core = { path = "../../packages/community-chat-report-core" }
community-contact-core = { path = "../../packages/community-contact-core" }
community-notification-core = { path = "../../packages/community-notification-core" }
community-publication-core = { path = "../../packages/community-publication-core" }
community-query-contribution-core = { path = "../../packages/community-query-contribution-core" }
community-search-core = { path = "../../packages/community-search-core" }
hex = "0.4"
rand = "0.8"
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "sync"], default-features = false }
url = "2"
zeroize = "1"

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
