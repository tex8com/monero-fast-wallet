[package]
name = "fast-wallet-directory"
version = "0.1.0"
edition = "2021"
publish = false
license = "AGPL-3.0-only"

[dependencies]
axum = { version = "0.8", features = ["http1", "json", "tokio"], default-features = false }
fast-wallet-protocol = { path = "../../native/fast-wallet-protocol" }
fs2 = "0.4"
hex = "0.4"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
subtle = "2"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal"], default-features = false }
zeroize = "1"

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
