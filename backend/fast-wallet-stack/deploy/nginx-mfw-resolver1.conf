server {
    listen 80;
    server_name mfw-resolver1.tex8.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
    }

    location / {
        return 308 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name mfw-resolver1.tex8.com;

    ssl_certificate /etc/letsencrypt/live/mfw-resolver1.tex8.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mfw-resolver1.tex8.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    access_log /var/log/nginx/mfw-resolver1.access.log;
    error_log /var/log/nginx/mfw-resolver1.error.log;

    include /etc/nginx/snippets/mfw-static-site.conf;
    include /etc/nginx/snippets/mfw-public-readonly-content.conf;

    location ^~ /v1/mfw/names/ {
        limit_except GET { deny all; }
        limit_req zone=mfw_name_resolver burst=30 nodelay;
        proxy_pass http://private-node-ip:18089;
        include /etc/nginx/proxy_params;
        proxy_connect_timeout 2s;
        proxy_read_timeout 10s;
        proxy_buffering off;
        client_max_body_size 1k;
        add_header Cache-Control "no-store" always;
    }

    location ^~ /v1/mfw/name-suggestions/ {
        limit_except GET { deny all; }
        limit_req zone=mfw_name_resolver burst=30 nodelay;
        proxy_pass http://private-node-ip:18089;
        include /etc/nginx/proxy_params;
        proxy_connect_timeout 2s;
        proxy_read_timeout 10s;
        proxy_buffering off;
        client_max_body_size 1k;
        add_header Cache-Control "no-store" always;
    }

    location / {
        return 404;
    }
}
