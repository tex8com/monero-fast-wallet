[Service]
# ScanPack production settings for Monero Fast Node.
# v2 starts a clean derived cache after canonical v1 transaction pruning was
# fixed. Reusing the legacy directory would keep signed, malformed packs live.
Environment=CUPRATE_SCANPACK_DIRECTORY=/var/lib/cuprate/fast-wallet-scanpacks-v2
Environment=CUPRATE_SCANPACK_SIGNING_KEY_FILE=/etc/cuprate/scanpack-signing.key
Environment=CUPRATE_SCANPACK_START_HEIGHT=3400000
Environment=CUPRATE_SCANPACK_BLOCKS_PER_PACK=1000
Environment=CUPRATE_SCANPACK_INTERVAL_MS=5000
