# Loaded by Nginx inside the http context. Desktop provider bootstrap lacks the
# mobile Firebase App Check grant, so its OS-secured installation credential is
# paired with a strict public-edge IP rate limit to bound registration abuse.
limit_req_zone $binary_remote_addr zone=fast_wallet_desktop_bootstrap:10m rate=2r/m;

# Public `.mfw` resolution is read-only and deliberately unauthenticated, but
# a bounded edge rate prevents one client from monopolizing the canonical
# Monero Fast Node index while wallets perform debounced availability checks.
limit_req_zone $binary_remote_addr zone=mfw_name_resolver:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=fast_wallet_worker_directory:10m rate=6r/m;
limit_req_zone $binary_remote_addr zone=fast_wallet_worker_wake:10m rate=30r/s;
