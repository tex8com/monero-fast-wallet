# Include inside the primary onion server only. Internal notification ingress
# is intentionally NOT proxied. Log neither bearer tokens nor opaque job IDs.
location ^~ /v1/mfw/claim-relay/ {
    limit_except GET PUT DELETE { deny all; }
    limit_req zone=mfw_claim_relay burst=20 nodelay;
    limit_req_status 429;
    client_max_body_size 400k;
    proxy_pass http://127.0.0.1:8101;
    proxy_connect_timeout 3s;
    proxy_read_timeout 35s;
    proxy_request_buffering on;
    proxy_set_header Host $host;
    proxy_set_header Authorization $http_authorization;
    add_header Cache-Control "no-store" always;
    access_log off;
}
