[package]
name = "enthusiast-operations"
version = "0.1.0"
edition = "2021"
publish = false
license = "AGPL-3.0-only"

[dependencies]
community-chat-report-core = { path = "../../packages/community-chat-report-core" }
community-notification-core = { path = "../../packages/community-notification-core" }
community-publication-core = { path = "../../packages/community-publication-core" }
hex = "0.4"
rusqlite = { version = "0.37", features = ["bundled"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time"], default-features = false }
zeroize = "1"

[dev-dependencies]
community-search-core = { path = "../../packages/community-search-core" }
tempfile = "3"
