[package]
name = "mfw-private-directory"
version = "0.1.0"
edition = "2021"
publish = false
license = "AGPL-3.0-only"

[dependencies]
axum = { version = "0.8", features = ["http1", "tokio"], default-features = false }
async-trait = "0.1"
fs2 = "0.4"
getrandom = "0.2"
hex = "0.4"
hmac = "0.12"
libc = "0.2"
mfw-recipient-protocol = { path = "../../native/mfw-recipient-protocol" }
reqwest = { version = "0.12", features = ["http2", "rustls-tls", "stream"], default-features = false }
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"], default-features = false }
tower-http = { version = "0.6", features = ["limit"], default-features = false }
zeroize = "1"

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
