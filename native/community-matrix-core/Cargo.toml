[package]
name = "community-matrix-core"
version = "0.1.0"
edition = "2021"
publish = false
license = "AGPL-3.0-only"
rust-version = "1.93"

[lib]
crate-type = ["rlib", "staticlib"]

[features]
default = []
community-runtime = ["dep:community-runtime-core", "community-runtime-core/native-harrier"]

[dependencies]
community-runtime-core = { path = "../community-runtime-core", optional = true }
matrix-sdk = { version = "=0.18.0", default-features = false, features = ["e2e-encryption", "automatic-room-key-forwarding", "bundled-sqlite", "socks"] }
reqwest = { version = "=0.13.1", default-features = false, features = ["rustls", "socks"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "time"] }
url = "2"
zeroize = "1"

[dev-dependencies]
tempfile = "3"
