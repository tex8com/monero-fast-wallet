[package]
name = "fast-wallet-protocol"
version = "0.1.0"
edition = "2021"
publish = false
license = "MIT OR Apache-2.0"

[lib]
crate-type = ["rlib", "staticlib", "cdylib"]

[features]
default = []
# Mobile links one Rust static archive only. This feature compiles the
# authenticated Monero acceleration C ABI into the protocol archive so Rust's
# standard library is not duplicated at the final Android/iOS link.
mobile-fast-crypto = ["dep:rayon", "dep:mfw-product-core"]

[dependencies]
argon2 = "0.5"
chacha20poly1305 = "0.10"
curve25519-dalek = { version = "4", features = ["alloc"] }
ed25519-dalek = { version = "2.2", features = ["zeroize"] }
getrandom = "0.4"
hex = "0.4"
hpke = { version = "0.14", default-features = false, features = ["alloc", "getrandom", "x25519", "hkdfsha2", "chacha"] }
mfw-recipient-protocol = { path = "../mfw-recipient-protocol" }
mfw-product-core = { path = "../product-core", optional = true }
monero-address = { git = "https://github.com/monero-oxide/monero-oxide.git", rev = "7c288b058ae7f1e3d36600a2af11b3176102bcfc" }
rayon = { version = "1.10", optional = true }
sha2 = "0.10"
thiserror = "2"
url = "2"
zeroize = { version = "1", features = ["derive"] }

[dev-dependencies]
libc = "0.2"
serde_json = "1"
tempfile = "3"

[patch.crates-io]
# Reviewed API adapters delegate arithmetic to upstream crypto-bigint 0.7.10.
dalek-ff-group-04 = { package = "dalek-ff-group", path = "../../third_party/dalek-ff-group-0.4.6" }
dalek-ff-group-05 = { package = "dalek-ff-group", path = "../../third_party/dalek-ff-group-0.5.0" }
minimal-ed448 = { path = "../../third_party/minimal-ed448-0.4.2" }
elliptic-curve = { path = "../../third_party/elliptic-curve-0.13.8" }

[patch."https://github.com/monero-oxide/monero-oxide.git"]
monero-generators = { path = "../../third_party/monero-generators-0.4.0" }
