[package]
name = "mfw-product-core"
version = "0.1.0"
edition = "2021"
publish = false
license = "BSD-3-Clause"

[lib]
crate-type = ["rlib", "staticlib", "cdylib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
sha2 = "0.10"
argon2 = "0.5"
getrandom = "0.2"
zeroize = "1.8"

[dev-dependencies]
