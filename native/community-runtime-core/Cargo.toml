[package]
name = "community-runtime-core"
version = "0.1.0"
edition = "2021"
publish = false
license = "AGPL-3.0-only"
rust-version = "1.77"

[lib]
crate-type = ["rlib", "staticlib"]

[features]
default = []
native-harrier = []

[dependencies]
community-search-core = { path = "../../packages/community-search-core" }
ed25519-dalek = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"

[dev-dependencies]
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["std"] }
rand = "0.8"
tempfile = "3"
