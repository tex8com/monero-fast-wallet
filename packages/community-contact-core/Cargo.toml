[package]
name = "community-contact-core"
version = "0.1.0"
edition = "2021"
publish = false
license = "AGPL-3.0-only"
rust-version = "1.77"

[dependencies]
chacha20poly1305 = { version = "0.10", features = ["std"] }
rand = "0.8"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
zeroize = "1"

[dev-dependencies]
tempfile = "3"
