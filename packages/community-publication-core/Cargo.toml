[package]
name = "community-publication-core"
version = "0.1.0"
edition = "2021"
publish = false
license = "AGPL-3.0-only"

[dependencies]
chacha20poly1305 = { version = "0.10", features = ["std"] }
community-search-core = { path = "../community-search-core" }
ed25519-dalek = "2"
hex = "0.4"
rand = "0.8"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
zeroize = "1"

[dev-dependencies]
ed25519-dalek = { version = "2", features = ["rand_core"] }
tempfile = "3"
