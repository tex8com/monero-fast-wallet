[package]
name = "monero-fast-wallet-tui"
version = "0.1.0"
edition = "2021"
publish = false
license = "AGPL-3.0-only"
rust-version = "1.97"
description = "Fullscreen, mouse-capable TUI launcher for Monero Fast Wallet CLI"

[[bin]]
name = "fast-wallet-cli"
path = "src/main.rs"

[lib]
name = "monero_fast_wallet_tui"
path = "src/lib.rs"

[dependencies]
crossterm = "0.28"
qrcode = { version = "0.14", default-features = false, features = [] }
ratatui = { version = "0.29", default-features = false, features = ["crossterm"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
zeroize = { version = "1", features = ["derive"] }

[dev-dependencies]
ratatui = { version = "0.29", default-features = false, features = ["crossterm"] }
tempfile = "3"
zeroize = { version = "1", features = ["derive"] }
