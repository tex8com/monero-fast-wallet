buildscript {
    ext {
        buildToolsVersion = "36.0.0"
        minSdkVersion = 24
        // tor-android 0.4.9.11 is compiled against API 37. This changes only
        // which APIs the compiler can see; targetSdk and runtime behavior stay
        // on API 36 until that migration is tested separately.
        compileSdkVersion = 37
        targetSdkVersion = 36
        ndkVersion = "27.1.12297006"
        kotlinVersion = "2.1.20"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle:8.12.0")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:2.1.20")
        classpath("com.google.gms:google-services:4.4.4")
    }
}

apply plugin: "com.facebook.react.rootproject"

project(":app") {
    def developmentDependencyLockingLenient = (
            findProperty("moneroDevelopmentDependencyLockingLenient") ?: "false"
    ).toString().toBoolean()
    def configuredApplicationId = (
            findProperty("moneroWalletApplicationId") ?: "com.tex8.monerowallet"
    ).toString()
    if (developmentDependencyLockingLenient &&
            configuredApplicationId == "com.tex8.monerowallet") {
        throw new GradleException(
                "Lenient dependency locking is allowed only for a separate development application ID"
        )
    }
    dependencyLocking {
        lockAllConfigurations()
        // The dormant V2 Harrier runtime is feature-gated in app/build.gradle.
        // Gradle STRICT mode otherwise rejects its pinned lock entry whenever
        // the V1 release omits that dependency from the graph. Its exact version
        // and artifact checksums remain pinned by the build file and dependency
        // verification metadata for a future V2 build.
        ignoredDependencies.add("org.pytorch:executorch-android")
        lockMode = developmentDependencyLockingLenient
                ? LockMode.LENIENT
                : LockMode.STRICT
    }
}
